<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Rico Moderno</title>
    <meta name="description" content="Find Your Way Back to Yourself. Break free from patterns, let go, and rediscover your true self through inner work, meditation, and transformational coaching." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800&family=Open+Sans:wght@300;400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/jpeg" href="/images/logo.jpg" />
    <script type="module" crossorigin src="/assets/index-Fx3calm.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-cKmI2ls6.css">
    <style>
      /* Slow, calm drift of the starry hero backgrounds */
      @media (prefers-reduced-motion: no-preference) {
        .cosmic-drift {
          animation: cosmic-drift 45s ease-in-out infinite alternate;
          will-change: transform;
          backface-visibility: hidden;
        }
        .cosmic-drift-fixed {
          background-attachment: scroll !important;
        }
      }
      @keyframes cosmic-drift {
        0%   { transform: scale(1.15) translate3d(-4%, -2.5%, 0); }
        50%  { transform: scale(1.18) translate3d(0.5%, 1.5%, 0); }
        100% { transform: scale(1.15) translate3d(4%, 2.5%, 0); }
      }
      /* Phones: narrower screens need a little more drift to be visible */
      @keyframes cosmic-drift-phone {
        0%   { transform: scale(1.2) translate3d(-7%, -3.5%, 0); }
        50%  { transform: scale(1.23) translate3d(1%, 2%, 0); }
        100% { transform: scale(1.2) translate3d(7%, 3.5%, 0); }
      }
      @media (max-width: 768px) and (prefers-reduced-motion: no-preference) {
        .cosmic-drift {
          animation-name: cosmic-drift-phone;
        }
      }
      /* Homepage hero: twinkling glints on the RM letters + shimmering headline */
      .rm-glints { display: none; }
      @media (prefers-reduced-motion: no-preference) {
        .rm-glints {
          display: flex;
          position: absolute;
          inset: 0;
          z-index: 2;
          pointer-events: none;
          align-items: center;
          justify-content: center;
          container-type: size;
        }
        .rm-glints-box {
          position: relative;
          width: min(100cqw, calc(100cqh * 1100 / 614));
          aspect-ratio: 1100 / 614;
          container-type: inline-size;
        }
        .rm-glint {
          position: absolute;
          width: calc(var(--s) * 1cqw);
          height: calc(var(--s) * 1cqw);
          opacity: 0;
          transform: translate(-50%, -50%) scale(0.4);
          mix-blend-mode: screen;
          background: radial-gradient(circle, rgba(255,255,255,0.95) 0 5%, rgba(186,230,253,0.5) 14%, rgba(186,230,253,0) 40%);
          animation: rm-twinkle var(--d) ease-in-out var(--dl) infinite;
          will-change: opacity, transform;
        }
        .rm-glint::before, .rm-glint::after {
          content: "";
          position: absolute;
          background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,0.85), rgba(255,255,255,0));
        }
        .rm-glint::before { left: 0; right: 0; top: 50%; height: 2px; margin-top: -1px; }
        .rm-glint::after {
          top: 0; bottom: 0; left: 50%; width: 2px; margin-left: -1px;
          background: linear-gradient(180deg, rgba(255,255,255,0), rgba(255,255,255,0.85), rgba(255,255,255,0));
        }
        .hero-shimmer {
          background-image: linear-gradient(90deg, #22d3ee 0%, #a78bfa 30%, #e2e8f0 50%, #a78bfa 70%, #22d3ee 100%) !important;
          background-size: 200% 100% !important;
          background-repeat: repeat-x !important;
          animation: hero-shimmer 14s linear infinite;
        }
      }
      @keyframes rm-twinkle {
        0%, 100% { opacity: 0; transform: translate(-50%, -50%) scale(0.4) rotate(0deg); }
        45%      { opacity: 0.9; transform: translate(-50%, -50%) scale(1) rotate(15deg); }
        60%      { opacity: 0.6; transform: translate(-50%, -50%) scale(0.85) rotate(20deg); }
      }
      @keyframes hero-shimmer {
        from { background-position: 0% 50%; }
        to   { background-position: -200% 50%; }
      }
      /* Inner Work: breathing glow behind the heading */
      .breath-heading { position: relative; isolation: isolate; }
      .breath-heading::before {
        content: "";
        position: absolute;
        left: -22%;
        top: 50%;
        width: 105%;
        aspect-ratio: 1.6;
        transform: translateY(-50%) scale(1);
        background: radial-gradient(ellipse at center, rgba(34,211,238,0.5) 0%, rgba(167,139,250,0.3) 38%, rgba(167,139,250,0) 70%);
        filter: blur(8px);
        opacity: 0.85;
        z-index: -1;
        pointer-events: none;
      }
      /* After Work: softer fade-in, cards one after another */
      .aw-page .fade-up { transition-duration: 1.2s, 1.2s; transform: translateY(24px); }
      .aw-page .fade-up.visible { transform: translateY(0); }
      .aw-page .fade-up:nth-child(2) { transition-delay: 0.12s; }
      .aw-page .fade-up:nth-child(3) { transition-delay: 0.24s; }
      .aw-page .fade-up:nth-child(4) { transition-delay: 0.36s; }
      .aw-page .fade-up:nth-child(5) { transition-delay: 0.48s; }
      .aw-page .fade-up:nth-child(6) { transition-delay: 0.6s; }
      /* Coaching: soft glow around "Most popular" */
      .pkg-popular::after {
        content: "";
        position: absolute;
        inset: -1px;
        border-radius: 4px;
        pointer-events: none;
        box-shadow: 0 0 36px rgba(var(--glow-rgb), 0.35), 0 0 90px rgba(var(--glow-rgb), 0.15);
        opacity: 0.6;
      }
      /* Contact: checkmark after sending */
      .sent-check { width: 64px; height: 64px; margin: 0 auto 1.5rem; display: block; filter: drop-shadow(0 0 14px rgba(34,211,238,0.55)); }
      .sent-check circle, .sent-check path { fill: none; stroke: #22d3ee; stroke-linecap: round; stroke-linejoin: round; }
      .sent-check circle { stroke-width: 2.5; stroke: rgba(34,211,238,0.6); }
      .sent-check path { stroke-width: 4; }
      @media (prefers-reduced-motion: no-preference) {
        .breath-heading::before { animation: breath-glow 8s ease-in-out infinite; }
        @media (hover: hover) {
          .pkg-card.fade-up.visible:hover {
            transform: translateY(-6px);
            box-shadow: 0 16px 40px rgba(0,0,0,0.35), 0 0 40px rgba(var(--glow-rgb), 0.12) !important;
          }
          .pkg-popular.fade-up.visible:hover {
            box-shadow: 0 16px 40px rgba(0,0,0,0.35), 0 0 70px rgba(var(--glow-rgb), 0.25), 0 0 120px rgba(var(--glow-rgb), 0.08) !important;
          }
        }
        .pkg-popular::after { animation: pkg-glow 6s ease-in-out infinite alternate; }
        .sent-check circle { stroke-dasharray: 176; stroke-dashoffset: 176; animation: draw 0.8s ease-out 0.1s forwards; }
        .sent-check path { stroke-dasharray: 40; stroke-dashoffset: 40; animation: draw 0.5s ease-out 0.75s forwards; }
        .sent-check { animation: check-pop 0.6s cubic-bezier(0.34, 1.4, 0.64, 1) 0.65s both; }
      }
      @media (prefers-reduced-motion: reduce) {
        .fade-up { transform: none !important; }
      }
      @keyframes breath-glow {
        0%, 100% { opacity: 0.55; transform: translateY(-50%) scale(0.88); }
        50%      { opacity: 1;    transform: translateY(-50%) scale(1.2); }
      }
      @keyframes pkg-glow { from { opacity: 0.35; } to { opacity: 1; } }
      @keyframes draw { to { stroke-dashoffset: 0; } }
      @keyframes check-pop { 0% { transform: scale(1); } 40% { transform: scale(1.08); } 100% { transform: scale(1); } }
      /* About: lotus meditation figure, floating freely with a breathing glow */
      .lotus-figure { width: 100%; height: 100%; display: block; overflow: visible; }
      .journey-box { aspect-ratio: 300 / 290 !important; }
      .lotus-figure .lotus-glow { opacity: 0.75; }
      @media (max-width: 768px) {
        .journey-box { max-width: 220px; margin: 0 auto; }
      }
      /* After Work: dawn layers */
      .aw-dawn-glow {
        position: absolute; inset: 0; pointer-events: none; mix-blend-mode: screen; opacity: 0.55;
        background: radial-gradient(ellipse 45% 55% at 70% 52%, rgba(249,115,22,0.38) 0%, rgba(249,115,22,0) 70%),
                    radial-gradient(ellipse 45% 55% at 38% 38%, rgba(167,139,250,0.32) 0%, rgba(167,139,250,0) 70%);
      }
      .aw-dawn-veil { position: absolute; inset: 0; pointer-events: none; background: #05050f; opacity: 0; }
      /* After Work: four life-area cards */
      .life-cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; margin-top: 2.5rem; }
      @media (max-width: 640px) { .life-cards { grid-template-columns: repeat(2, 1fr); } }
      .life-card {
        display: flex; flex-direction: column; align-items: center; gap: 0.75rem;
        padding: 1.4rem 0.75rem; border-radius: 4px; text-align: center;
        background: rgba(10,10,30,0.55); border: 1px solid rgba(167,139,250,0.18);
        box-shadow: 0 0 22px color-mix(in srgb, var(--c) 18%, transparent);
      }
      .life-icon svg { width: 30px; height: 30px; fill: none; stroke: var(--c); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; display: block; filter: drop-shadow(0 0 6px var(--c)); }
      .life-label { font-family: 'Cinzel', serif; font-size: 0.8rem; letter-spacing: 0.08em; color: #e2e8f0; }
      /* All pages: soft light sweep across the main heading */
      .sweep-heading { position: relative; }
      /* Homepage hero: fill the screen without distortion */
      .hero-logo { background-size: cover !important; }
      .hero-logo-fill { display: none; }
      @media (max-aspect-ratio: 1/1) {
        .hero-logo {
          background-size: contain !important;
          -webkit-mask-image: linear-gradient(to bottom, transparent calc(50% - 28vw), #000 calc(50% - 18vw), #000 calc(50% + 18vw), transparent calc(50% + 28vw));
          mask-image: linear-gradient(to bottom, transparent calc(50% - 28vw), #000 calc(50% - 18vw), #000 calc(50% + 18vw), transparent calc(50% + 28vw));
        }
        .hero-logo-fill {
          display: block; position: absolute; inset: -40px; z-index: 1; opacity: 0.6;
          background-size: cover; background-position: center;
          filter: blur(22px) brightness(0.6) saturate(1.1);
        }
      }
      .rm-glints { overflow: hidden; }
      @media (min-aspect-ratio: 1/1) {
        .rm-glints-box { width: max(100cqw, calc(100cqh * 1100 / 614)) !important; }
      }
      @media (prefers-reduced-motion: no-preference) {
        .lotus-figure .lotus-glow { transform-box: fill-box; transform-origin: 50% 50%; animation: lotus-breathe 7s ease-in-out infinite; }
        .lotus-figure .lotus-body { transform-box: fill-box; transform-origin: 50% 100%; animation: lotus-body 7s ease-in-out infinite; }
        .aw-dawn-veil { animation: dawn-veil 7s cubic-bezier(0.3, 0, 0.2, 1) 0.2s both; }
        .aw-dawn-glow { animation: dawn-glow 8s cubic-bezier(0.3, 0, 0.2, 1) 0.6s both; }
        .life-card.visible { animation: life-glow 1.8s ease-out calc(var(--i) * 0.4s) both; }
        .sweep-heading::after {
          content: attr(data-sweep);
          content: attr(data-sweep) / "";
          position: absolute; inset: 0; pointer-events: none;
          white-space: pre-line;
          color: transparent; -webkit-text-fill-color: transparent;
          background: linear-gradient(105deg, rgba(255,255,255,0) 40%, rgba(255,255,255,0.85) 50%, rgba(255,255,255,0) 60%);
          background-size: 250% 100%; background-repeat: no-repeat; background-position: 100% 0;
          -webkit-background-clip: text; background-clip: text;
          animation: heading-sweep 8s ease-in-out 0.7s infinite;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }
      @keyframes lotus-breathe {
        0%, 100% { opacity: 0.55; transform: scale(0.92); }
        50%      { opacity: 1;    transform: scale(1.1); }
      }
      @keyframes lotus-body { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(1.008, 1.016); } }
      @keyframes dawn-veil { from { opacity: 0.7; } to { opacity: 0; } }
      @keyframes dawn-glow { from { opacity: 0; } to { opacity: 0.55; } }
      @keyframes life-glow {
        0%   { opacity: 0.25; box-shadow: 0 0 0 color-mix(in srgb, var(--c) 0%, transparent); border-color: rgba(167,139,250,0.1); }
        55%  { opacity: 1;    box-shadow: 0 0 34px color-mix(in srgb, var(--c) 45%, transparent); border-color: color-mix(in srgb, var(--c) 60%, transparent); }
        100% { opacity: 1;    box-shadow: 0 0 22px color-mix(in srgb, var(--c) 18%, transparent); border-color: rgba(167,139,250,0.18); }
      }
      @keyframes heading-sweep {
        0%        { background-position: 100% 0; }
        28%, 100% { background-position: 0% 0; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
