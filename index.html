      }
      @keyframes speck-rise {
        0%   { opacity: 0;   transform: translateY(0); }
        15%  { opacity: 0.85; }
        80%  { opacity: 0.6; }
        100% { opacity: 0;   transform: translateY(-280px); }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }
      @keyframes lotus-breathe {
        0%, 100% { opacity: 0.55; transform: scale(0.92); }
        50%      { opacity: 1;    transform: scale(1.1); }
      }
      @keyframes lotus-body { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(1.008, 1.016); } }
      @keyframes dawn-veil { from { opacity: 0.85; } to { opacity: 0; } }
      @keyframes dawn-glow { 0% { opacity: 0; } 100% { opacity: 1; } }
      @keyframes life-glow {
        0%   { opacity: 0.25; box-shadow: 0 0 0 color-mix(in srgb, var(--c) 0%, transparent); border-color: rgba(167,139,250,0.1); }
        55%  { opacity: 1;    box-shadow: 0 0 34px color-mix(in srgb, var(--c) 45%, transparent); border-color: color-mix(in srgb, var(--c) 60%, transparent); }
        100% { opacity: 1;    box-shadow: 0 0 22px color-mix(in srgb, var(--c) 18%, transparent); border-color: rgba(167,139,250,0.18); }
      }
      @keyframes heading-sweep {
        0%        { background-position: 100% 0; }
        32%, 100% { background-position: 0% 0; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      /* Shooting stars: one soft streak every 10-20 s, on any page, in a free part of the starry background
         (never over text, images, cards, buttons or the menu bar). Off with "reduce motion". */
      (function () {
        var rm = window.matchMedia('(prefers-reduced-motion: reduce)');
        var sky = null;
        function rand(a, b) { return a + Math.random() * (b - a); }
        function ensureSky() {
          if (sky && sky.isConnected) return sky;
          sky = document.createElement('div');
          sky.className = 'sky-stars';
          sky.setAttribute('aria-hidden', 'true');
          document.body.appendChild(sky);
          return sky;
        }
        function topBar() {
          var b = 0;
          document.elementsFromPoint(window.innerWidth / 2, 4).forEach(function (e) {
            for (var n = e; n && n !== document.body; n = n.parentElement) {
              if (getComputedStyle(n).position === 'fixed') { b = Math.max(b, n.getBoundingClientRect().bottom); break; }
            }
          });
          return b;
        }
        function obstacles(vh) {
          var out = [];
          var sel = 'h1,h2,h3,h4,h5,h6,p,li,label,a,button,input,textarea,select,img,svg,video,iframe,form,' +
                    '[class*="card"],[class*="btn"],.journey-box,.life-cards,blockquote,span';
          document.querySelectorAll(sel).forEach(function (e) {
            if (e.closest('.sky-stars')) return;
            var r = e.getBoundingClientRect();
            if (r.width === 0 || r.height === 0 || r.bottom < 0 || r.top > vh) return;
            if (e.tagName === 'SPAN' && !e.textContent.trim()) return;
            out.push(r);
          });
          return out;
        }
        function shoot() {
          if (rm.matches || document.hidden) return;
          var vw = window.innerWidth, vh = window.innerHeight, top = topBar() + 14;
          var O = obstacles(vh), phone = vw < 769;
          var L = phone ? 80 : 120, D = phone ? 150 : 230, pad = 36;
          for (var tries = 0; tries < 80; tries++) {
            var ang = (Math.random() < 0.5 ? rand(14, 30) : rand(150, 166)) * Math.PI / 180;
            var x0 = rand(0, vw), y0 = rand(top, vh - 20);
            var ok = true;
            for (var s = -L; s <= D + 4 && ok; s += 10) {
              var x = x0 + Math.cos(ang) * s, y = y0 + Math.sin(ang) * s;
              if (x < 6 || x > vw - 6 || y < top || y > vh - 8) ok = false;
              for (var k = 0; k < O.length && ok; k++) {
                var t = O[k];
                if (x > t.left - pad && x < t.right + pad && y > t.top - pad && y < t.bottom + pad) ok = false;
              }
            }
            if (!ok) continue;
            var el = document.createElement('i');
            el.className = 'shooting-star';
            el.style.width = L + 'px';
            ensureSky().appendChild(el);
            var base = 'translate(' + (x0 - Math.cos(ang) * L) + 'px,' + (y0 - Math.sin(ang) * L) + 'px) rotate(' + ang + 'rad)';
            var anim = el.animate([
              { opacity: 0, transform: base + ' translateX(0px)' },
              { opacity: 0.85, offset: 0.18 },
              { opacity: 0, transform: base + ' translateX(' + D + 'px)' }
            ], { duration: 1400, easing: 'cubic-bezier(0.2, 0.6, 0.4, 1)' });
            anim.onfinish = function () { el.remove(); };
            return true;
          }
          return false;
        }
        function loop() {
          setTimeout(function () {
            /* if there is no free sky right now, try again a few seconds later */
            if (shoot() === false) { setTimeout(function () { shoot(); }, 3000); }
            loop();
          }, rand(10000, 20000));
        }
        setTimeout(function () { shoot(); loop(); }, rand(3500, 7000));
      })();
    </script>
  </body>
</html>
